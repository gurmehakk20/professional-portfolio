<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gurmehak monogram: a white "G" on a deep-to-lighter cobalt tile (#1c4e9c to #3169c4). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4e9c"/>
      <stop offset="1" stop-color="#3169c4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <path fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="miter" d="M18.6 12.14A6 6 0 1 0 20 16h-5"/>
  <rect x="22.5" y="20" width="3.5" height="4" rx="1" fill="#dbe6f8"/>
</svg>
